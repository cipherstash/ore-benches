<text x="480" y="26" text-anchor="middle" font-size="16" font-weight="600">Data-key reuse: sequential vs scattered reads (50-record query, 3 fields each)</text>
<text x="480" y="46" text-anchor="middle" font-size="12" fill="#6b7280">Reuse amortises sequential reads but collapses to one KMS call per record when the read pattern scatters. ZeroKMS is flat.</text>
