<circle cx="570.0" cy="382.6" r="4" fill="#7c3aed"/>
<circle cx="745.0" cy="354.2" r="4" fill="#7c3aed"/>
<circle cx="920.0" cy="103.6" r="4" fill="#7c3aed"/>
<circle cx="920.0" cy="103.6" r="8" fill="none" stroke="#dc2626" stroke-width="2"/>
<rect x="104" y="457" width="14" height="3" fill="#16a34a"/>
<text x="124" y="462" fill="#374151">ZeroKMS (bulk)</text>
<rect x="232" y="457" width="14" height="3" fill="#ea580c"/>
<text x="252" y="462" fill="#374151">AWS KMS (direct)</text>
<rect x="374" y="457" width="14" height="3" fill="#7c3aed"/>
<text x="394" y="462" fill="#374151">AWS KMS (envelope)</text>
<circle cx="536" cy="458" r="6" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="548" y="462" fill="#374151">= had failures (throttling)</text>
</svg>
