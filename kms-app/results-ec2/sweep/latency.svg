<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" font-family="system-ui,-apple-system,sans-serif" font-size="12">
<rect width="960" height="480" fill="white"/>
<text x="480" y="24" text-anchor="middle" font-size="16" font-weight="600">ZeroKMS vs AWS KMS — median p95 latency by batch size (3 fields/record)</text>
<text x="269" y="40" text-anchor="middle" font-weight="600">Insert (encrypt + write)</text>
<line x1="104" y1="384" x2="474" y2="384" stroke="#e5e7eb"/>
<text x="98" y="388" text-anchor="end" fill="#6b7280">0</text>
<line x1="104" y1="302" x2="474" y2="302" stroke="#e5e7eb"/>
<text x="98" y="306" text-anchor="end" fill="#6b7280">2s</text>
<line x1="104" y1="220" x2="474" y2="220" stroke="#e5e7eb"/>
<text x="98" y="224" text-anchor="end" fill="#6b7280">4s</text>
<line x1="104" y1="138" x2="474" y2="138" stroke="#e5e7eb"/>
<text x="98" y="142" text-anchor="end" fill="#6b7280">6s</text>
<line x1="104" y1="56" x2="474" y2="56" stroke="#e5e7eb"/>
<text x="98" y="60" text-anchor="end" fill="#6b7280">8s</text>
<text x="104" y="404" text-anchor="middle" fill="#374151">20</text>
<text x="279" y="404" text-anchor="middle" fill="#374151">100</text>
<text x="454" y="404" text-anchor="middle" fill="#374151">500</text>
<text x="269" y="424" text-anchor="middle" fill="#6b7280">records per request</text>
<polyline fill="none" stroke="#16a34a" stroke-width="2.5" points="104.0,383.3 279.0,381.9 454.0,350.3"/>
<circle cx="104.0" cy="383.3" r="4" fill="#16a34a"/>
<circle cx="279.0" cy="381.9" r="4" fill="#16a34a"/>
<circle cx="454.0" cy="350.3" r="4" fill="#16a34a"/>
<polyline fill="none" stroke="#ea580c" stroke-width="2.5" points="104.0,382.4 279.0,349.0 454.0,61.5"/>
<circle cx="104.0" cy="382.4" r="4" fill="#ea580c"/>
<circle cx="279.0" cy="349.0" r="4" fill="#ea580c"/>
<circle cx="454.0" cy="61.5" r="4" fill="#ea580c"/>
<circle cx="454.0" cy="61.5" r="8" fill="none" stroke="#dc2626" stroke-width="2"/>
<polyline fill="none" stroke="#7c3aed" stroke-width="2.5" points="104.0,382.3 279.0,342.9 454.0,61.5"/>
<circle cx="104.0" cy="382.3" r="4" fill="#7c3aed"/>
<circle cx="279.0" cy="342.9" r="4" fill="#7c3aed"/>
<circle cx="454.0" cy="61.5" r="4" fill="#7c3aed"/>
<circle cx="454.0" cy="61.5" r="8" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="735" y="40" text-anchor="middle" font-weight="600">Query (read + decrypt)</text>
<line x1="570" y1="384" x2="940" y2="384" stroke="#e5e7eb"/>
<text x="564" y="388" text-anchor="end" fill="#6b7280">0</text>
<line x1="570" y1="302" x2="940" y2="302" stroke="#e5e7eb"/>
<text x="564" y="306" text-anchor="end" fill="#6b7280">2s</text>
<line x1="570" y1="220" x2="940" y2="220" stroke="#e5e7eb"/>
<text x="564" y="224" text-anchor="end" fill="#6b7280">4s</text>
<line x1="570" y1="138" x2="940" y2="138" stroke="#e5e7eb"/>
<text x="564" y="142" text-anchor="end" fill="#6b7280">6s</text>
<line x1="570" y1="56" x2="940" y2="56" stroke="#e5e7eb"/>
<text x="564" y="60" text-anchor="end" fill="#6b7280">8s</text>
<text x="570" y="404" text-anchor="middle" fill="#374151">20</text>
<text x="745" y="404" text-anchor="middle" fill="#374151">100</text>
<text x="920" y="404" text-anchor="middle" fill="#374151">500</text>
<text x="735" y="424" text-anchor="middle" fill="#6b7280">records per request</text>
<polyline fill="none" stroke="#16a34a" stroke-width="2.5" points="570.0,382.7 745.0,381.5 920.0,351.0"/>
<circle cx="570.0" cy="382.7" r="4" fill="#16a34a"/>
<circle cx="745.0" cy="381.5" r="4" fill="#16a34a"/>
<circle cx="920.0" cy="351.0" r="4" fill="#16a34a"/>
