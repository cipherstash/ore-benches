[tools]
python = "latest"
rust = "latest"

[env]
DATABASE_URL = "postgres://postgres:postgres@localhost:5400/postgres"
# Native Postgres benches cluster (migrated off Docker). psql / pg_isready /
# pg_dump pick up host/port/user/db from these; pg_ctl uses PGDATA.
PGHOST = "localhost"
PGPORT = "5400"
PGUSER = "postgres"
PGDATABASE = "postgres"
PGDATA = "{{env.HOME}}/.eqlbench/pgdata"
# Homebrew keg-only postgresql@17 — not on PATH by default.
_.path = ["/opt/homebrew/opt/postgresql@17/bin"]

[tasks.postgres-init]
description = "One-time: initdb + configure the native Postgres benches cluster"
run = """
#!/usr/bin/env bash
set -e
if [ -d "$PGDATA" ]; then
  echo "Cluster already exists: $PGDATA"
  exit 0
fi
echo "Initialising native benches cluster at $PGDATA ..."
initdb -D "$PGDATA" --auth=trust --username=postgres -E UTF8
cat >> "$PGDATA/postgresql.conf" <<'CONF'

# --- benches native cluster tuning ---
port = 5400
listen_addresses = 'localhost'
shared_buffers = 4GB
maintenance_work_mem = 4GB
effective_cache_size = 24GB
work_mem = 128MB
max_parallel_maintenance_workers = 4
max_wal_size = 8GB
CONF
echo "Cluster initialised. Next: mise run setup-db"
"""

[tasks.postgres]
description = "Start the native Postgres benches cluster"
depends = ["postgres-init"]
run = """
#!/usr/bin/env bash
set -e
if pg_ctl status -D "$PGDATA" >/dev/null 2>&1; then
  echo "Postgres already running ($PGDATA)."
else
  pg_ctl start -D "$PGDATA" -l "$PGDATA/server.log" -w
  echo "Postgres started ($PGDATA, port $PGPORT)."
fi
"""

[tasks.postgres-stop]
description = "Stop the native Postgres benches cluster"
run = """
#!/usr/bin/env bash
if pg_ctl status -D "$PGDATA" >/dev/null 2>&1; then
  pg_ctl stop -D "$PGDATA" -m fast
else
  echo "Postgres not running."
fi
"""

[tasks.postgres-logs]
description = "Tail the native Postgres server log"
run = """
#!/usr/bin/env bash
tail -f "$PGDATA/server.log"
"""

[tasks.psql]
description = "Open a psql shell on the benches database"
run = "psql"

[tasks.reset-db]
description = "Reset the database (drop and recreate)"
depends = ["postgres"]
run = """
#!/usr/bin/env bash
set -e

echo "Waiting for PostgreSQL to be ready..."
until pg_isready -U postgres > /dev/null 2>&1; do
  sleep 1
done

echo "Dropping and recreating database..."
psql -U postgres -d template1 -c "DROP DATABASE IF EXISTS postgres WITH (FORCE);"
psql -U postgres -d template1 -c "CREATE DATABASE postgres;"

echo "Database reset complete. Run 'mise run setup-db' to set up tables and data."
"""

[tasks.truncate]
description = "Truncate all bench tables (keeps EQL install + schema; just wipes rows)"
depends = ["postgres"]
run = """
#!/usr/bin/env bash
set -e

echo "Waiting for PostgreSQL to be ready..."
until pg_isready -U postgres > /dev/null 2>&1; do
  sleep 1
done

echo "Truncating all bench tables in public schema..."
psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
DO $$
DECLARE
  r record;
  table_list text := '';
BEGIN
  FOR r IN
    SELECT tablename
    FROM pg_tables
    WHERE schemaname = 'public'
      AND (tablename LIKE '%_encrypted%' OR tablename LIKE '%_plaintext%')
    ORDER BY tablename
  LOOP
    table_list := table_list || 'public.' || quote_ident(r.tablename) || ', ';
  END LOOP;

  IF table_list = '' THEN
    RAISE NOTICE 'No bench tables found to truncate.';
  ELSE
    table_list := rtrim(table_list, ', ');
    RAISE NOTICE 'Truncating: %', table_list;
    EXECUTE 'TRUNCATE TABLE ' || table_list || ' RESTART IDENTITY CASCADE';
  END IF;
END $$;
SQL

echo "Truncate complete. EQL version untouched."
"""

[tasks.setup-db]
description = "Set up the test database (create tables and load data)"
depends = ["postgres"]
run = """
#!/usr/bin/env bash
set -e

echo "Waiting for PostgreSQL to be ready..."
until pg_isready -U postgres > /dev/null 2>&1; do
  sleep 1
done

# EQL_SQL overrides the released download with a local build — used to test
# an unreleased EQL fix before a pre-release is cut, e.g.:
#   EQL_SQL=../encrypt-query-language/release/cipherstash-encrypt.sql mise run setup-db
if [ -n "${EQL_SQL:-}" ]; then
  echo "Using local EQL build: $EQL_SQL"
  cp "$EQL_SQL" /tmp/cipherstash-encrypt.sql
else
  echo "Downloading EQL (eql-2.3.0)..."
  curl -sLo /tmp/cipherstash-encrypt.sql https://github.com/cipherstash/encrypt-query-language/releases/download/eql-2.3.0/cipherstash-encrypt.sql
fi

echo "Installing EQL..."
psql -v ON_ERROR_STOP=1 -U postgres -d postgres < /tmp/cipherstash-encrypt.sql

echo "Creating tables..."
psql -v ON_ERROR_STOP=1 -U postgres -d postgres < sql/schema.sql

echo "Database setup complete!"
"""

[tasks.setup-db-v3]
description = "Install the EQL v3 SQL (eql_v3 schema) and create the _v3 bench tables. Additive: run after (or independently of) setup-db — v2 objects are untouched."
depends = ["postgres"]
run = """
#!/usr/bin/env bash
set -e

echo "Waiting for PostgreSQL to be ready..."
until pg_isready -U postgres > /dev/null 2>&1; do
  sleep 1
done

# There is no released v3 artifact yet — the installer comes from a local
# EQL repo build (`mise run build` writes release/cipherstash-encrypt.sql).
# EQL_V3_SQL overrides the default sibling-checkout location, mirroring the
# EQL_SQL override on setup-db:
#   EQL_V3_SQL=/path/to/cipherstash-encrypt.sql mise run setup-db-v3
EQL_V3_SQL="${EQL_V3_SQL:-../encrypt-query-language/release/cipherstash-encrypt.sql}"

if [ ! -f "$EQL_V3_SQL" ]; then
  echo "Error: EQL v3 installer not found at $EQL_V3_SQL"
  echo "Build it in the EQL repo first:  mise run build"
  echo "or point EQL_V3_SQL at an existing cipherstash-encrypt.sql (v3 build)."
  exit 1
fi

echo "Installing EQL v3 from $EQL_V3_SQL ..."
psql -v ON_ERROR_STOP=1 -U postgres -d postgres < "$EQL_V3_SQL"

echo "Creating _v3 tables..."
psql -v ON_ERROR_STOP=1 -U postgres -d postgres < sql/schema-v3.sql

echo "EQL v3 database setup complete!"
"""

[tasks."bench:build"]
description = "Build all binaries in release mode"
run = """
#!/usr/bin/env bash
set -e

echo "Building binaries in release mode..."
cargo build --release
"""

[tasks."bench:ingest:_run"]
description = "Internal: Run a generic ingest benchmark"
depends = ["postgres", "bench:build"]
run = """
#!/usr/bin/env bash
set -e
[ -f .env ] && set -a && source .env && set +a

BENCH_NAME="$1"
TABLE_NAME="$2"
NUM_RECORDS="${3:-500,1000,10000}"

if [ -z "$BENCH_NAME" ] || [ -z "$TABLE_NAME" ]; then
  echo "Error: BENCH_NAME and TABLE_NAME arguments must be provided"
  echo "Usage: mise run bench:ingest:_run <bench_name> <table_name> [num_records]"
  exit 1
fi

echo "Running $BENCH_NAME ingest benchmark..."
mise x -- hyperfine --export-json target/${BENCH_NAME}_hyperfine.json \
  -L num_records "${NUM_RECORDS}" --runs 2 \
  --prepare "psql -U postgres -d postgres -c 'TRUNCATE TABLE ${TABLE_NAME};'" \
  "NUM_RECORDS={num_records} ./target/release/$BENCH_NAME"

echo "Combining results..."
./target/release/combine_benchmark "$BENCH_NAME"

echo "Benchmark complete! Results written to results/ingest/${BENCH_NAME}_combined.json"
"""

[tasks."bench:ingest:encrypt_int"]
description = "Run encrypt_int ingest benchmark and combine results"
run = "mise run bench:ingest:_run encrypt_int integer_encrypted"

[tasks."bench:ingest:encrypt_string"]
description = "Run encrypt_string ingest benchmark and combine results"
run = "mise run bench:ingest:_run encrypt_string string_encrypted"

[tasks."bench:ingest:json-small"]
description = "Run encrypt_json_small (no-index baseline) ingest benchmark"
run = "mise run bench:ingest:_run encrypt_json_small json_small_encrypted"

[tasks."bench:ingest:json-large"]
description = "Run encrypt_json_large (no-index baseline) ingest benchmark"
run = "mise run bench:ingest:_run encrypt_json_large json_large_encrypted"

[tasks."bench:ingest:json-ste-vec-small"]
description = "Run encrypt_ste_vec_small (SteVec-indexed) ingest benchmark"
run = "mise run bench:ingest:_run encrypt_ste_vec_small json_ste_vec_small_encrypted $1"

[tasks."bench:ingest:json-ste-vec-small-gin"]
description = "Run encrypt_ste_vec_small ingest benchmark with the GIN index pre-created (measures index-write cost amortised over insert path)"
depends = ["postgres", "bench:build"]
run = """
#!/usr/bin/env bash
set -e
[ -f .env ] && set -a && source .env && set +a

BENCH_NAME="encrypt_ste_vec_small"
TABLE_NAME="json_ste_vec_small_encrypted"
NUM_RECORDS="${1:-500,1000,10000}"

echo "Waiting for PostgreSQL to be ready..."
until pg_isready -U postgres > /dev/null 2>&1; do
  sleep 1
done

echo "Truncating table and creating GIN index before ingest..."
psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "TRUNCATE TABLE ${TABLE_NAME};"
psql -v ON_ERROR_STOP=1 -U postgres -d postgres < sql/indexes/${TABLE_NAME}_down.sql
psql -v ON_ERROR_STOP=1 -U postgres -d postgres < sql/indexes/${TABLE_NAME}_up.sql

echo "Running $BENCH_NAME ingest benchmark (with GIN index)..."
mkdir -p results/ingest
hyperfine --export-json results/ingest/${BENCH_NAME}_gin_hyperfine.json \
  -L num_records "${NUM_RECORDS}" --runs 2 \
  --prepare "psql -U postgres -d postgres -c 'TRUNCATE TABLE ${TABLE_NAME};'" \
  "NUM_RECORDS={num_records} ./target/release/$BENCH_NAME"

echo "Benchmark complete! Results written to results/ingest/${BENCH_NAME}_gin_hyperfine.json"
"""

[tasks."bench:ingest:json-ste-vec-large"]
description = "Run encrypt_ste_vec_large (SteVec-indexed) ingest benchmark"
run = "mise run bench:ingest:_run encrypt_ste_vec_large json_large_encrypted"

[tasks."bench:ingest"]
description = "Run all ingest benchmarks sequentially"
depends = [
  "bench:ingest:encrypt_int",
  "bench:ingest:encrypt_string",
  "bench:ingest:json-small",
  "bench:ingest:json-large",
]

[tasks."prepare:_table"]
description = "Internal: Prepare a table with target row count"
depends = ["postgres", "bench:build"]
run = """
#!/usr/bin/env bash
set -e

BASE_TABLE="$1"
BINARY_NAME="$2"
TARGET_ROWS="$3"

if [ -z "$BASE_TABLE" ] || [ -z "$BINARY_NAME" ] || [ -z "$TARGET_ROWS" ]; then
  echo "Error: BASE_TABLE, BINARY_NAME, and TARGET_ROWS arguments required"
  echo "Usage: mise run prepare:_table <base_table> <binary_name> <target_rows>"
  exit 1
fi

# Validate TARGET_ROWS is one of the allowed values
case "$TARGET_ROWS" in
  10000|100000|1000000|10000000)
    ;;
  *)
    echo "Error: TARGET_ROWS must be one of: 10000, 100000, 1000000, 10000000"
    exit 1
    ;;
esac

# Construct table name with suffix
TABLE_NAME="${BASE_TABLE}_${TARGET_ROWS}"

echo "Waiting for PostgreSQL to be ready..."
until pg_isready -U postgres > /dev/null 2>&1; do
  sleep 1
done

echo "Counting rows in $TABLE_NAME table..."
CURRENT_ROWS=$(psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM $TABLE_NAME;" | tr -d ' ')

echo "Current rows: $CURRENT_ROWS"
echo "Target rows: $TARGET_ROWS"

if [ "$CURRENT_ROWS" -ge "$TARGET_ROWS" ]; then
  echo "Table already has $CURRENT_ROWS rows (>= $TARGET_ROWS). No action needed."
  exit 0
fi

echo "Dropping indexes..."
psql -U postgres -d postgres < sql/indexes/${TABLE_NAME}_down.sql

# ZeroKMS occasionally returns "Unexpected error" mid-stream on long encrypt
# runs (typically 150-400k rows in), killing the binary. The binary writes
# rows transactionally per batch, so a re-run from the current row count
# picks up where we left off. Retry the inner binary until the table
# reaches the target (or MAX_ATTEMPTS — typically <5 needed even at 10M).
MAX_ATTEMPTS=30
attempt=1
while true; do
  CURRENT_ROWS=$(psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM $TABLE_NAME;" | tr -d ' ')
  if [ "$CURRENT_ROWS" -ge "$TARGET_ROWS" ]; then
    echo "Table reached $CURRENT_ROWS rows (>= $TARGET_ROWS)."
    break
  fi
  if [ "$attempt" -gt "$MAX_ATTEMPTS" ]; then
    echo "Error: exceeded $MAX_ATTEMPTS attempts, table has $CURRENT_ROWS / $TARGET_ROWS rows."
    exit 1
  fi
  ROWS_TO_INSERT=$((TARGET_ROWS - CURRENT_ROWS))
  echo "Attempt $attempt: inserting $ROWS_TO_INSERT additional rows..."
  if NUM_RECORDS=$ROWS_TO_INSERT TABLE_SUFFIX="_${TARGET_ROWS}" ./target/release/$BINARY_NAME; then
    echo "Attempt $attempt: succeeded."
  else
    echo "Attempt $attempt: failed (likely ZeroKMS transient), retrying after backoff..."
    sleep 5
  fi
  attempt=$((attempt + 1))
done

echo "Creating indexes..."
psql -U postgres -d postgres < sql/indexes/${TABLE_NAME}_up.sql

# ANALYZE the freshly-loaded table so the planner has accurate
# selectivity stats for the functional indexes. Without this, the
# planner uses default selectivity assumptions (e.g. ~14% for `>`)
# and reliably picks Seq Scan over Index Scan for low-selectivity
# predicates — which silently looks like a benchmark of "EQL is slow"
# when really it's "stats are stale". Costs seconds even at 10M rows.
echo "Running ANALYZE..."
psql -U postgres -d postgres -c "ANALYZE $TABLE_NAME;"

FINAL_ROWS=$(psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM $TABLE_NAME;" | tr -d ' ')
echo "Preparation complete! Final row count: $FINAL_ROWS"
"""

[tasks."prepare:v3:_table"]
description = "Internal: Prepare a _v3 table with target row count (v3 twin of prepare:_table — index scripts come from sql/indexes/v3/)"
depends = ["postgres", "bench:build"]
run = """
#!/usr/bin/env bash
set -e

BASE_TABLE="$1"
BINARY_NAME="$2"
TARGET_ROWS="$3"

if [ -z "$BASE_TABLE" ] || [ -z "$BINARY_NAME" ] || [ -z "$TARGET_ROWS" ]; then
  echo "Error: BASE_TABLE, BINARY_NAME, and TARGET_ROWS arguments required"
  echo "Usage: mise run prepare:v3:_table <base_table> <binary_name> <target_rows>"
  exit 1
fi

case "$TARGET_ROWS" in
  10000|100000|1000000|10000000)
    ;;
  *)
    echo "Error: TARGET_ROWS must be one of: 10000, 100000, 1000000, 10000000"
    exit 1
    ;;
esac

TABLE_NAME="${BASE_TABLE}_${TARGET_ROWS}"

echo "Waiting for PostgreSQL to be ready..."
until pg_isready -U postgres > /dev/null 2>&1; do
  sleep 1
done

echo "Counting rows in $TABLE_NAME table..."
CURRENT_ROWS=$(psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM $TABLE_NAME;" | tr -d ' ')

echo "Current rows: $CURRENT_ROWS"
echo "Target rows: $TARGET_ROWS"

if [ "$CURRENT_ROWS" -ge "$TARGET_ROWS" ]; then
  echo "Table already has $CURRENT_ROWS rows (>= $TARGET_ROWS). No action needed."
  exit 0
fi

echo "Dropping indexes..."
psql -U postgres -d postgres < sql/indexes/v3/${TABLE_NAME}_down.sql

# Same ZeroKMS-transient retry loop as prepare:_table — the v3 bins write
# rows transactionally per batch, so a re-run picks up from the current
# row count.
MAX_ATTEMPTS=30
attempt=1
while true; do
  CURRENT_ROWS=$(psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM $TABLE_NAME;" | tr -d ' ')
  if [ "$CURRENT_ROWS" -ge "$TARGET_ROWS" ]; then
    echo "Table reached $CURRENT_ROWS rows (>= $TARGET_ROWS)."
    break
  fi
  if [ "$attempt" -gt "$MAX_ATTEMPTS" ]; then
    echo "Error: exceeded $MAX_ATTEMPTS attempts, table has $CURRENT_ROWS / $TARGET_ROWS rows."
    exit 1
  fi
  ROWS_TO_INSERT=$((TARGET_ROWS - CURRENT_ROWS))
  echo "Attempt $attempt: inserting $ROWS_TO_INSERT additional rows..."
  if NUM_RECORDS=$ROWS_TO_INSERT TABLE_SUFFIX="_${TARGET_ROWS}" ./target/release/$BINARY_NAME; then
    echo "Attempt $attempt: succeeded."
  else
    echo "Attempt $attempt: failed (likely ZeroKMS transient), retrying after backoff..."
    sleep 5
  fi
  attempt=$((attempt + 1))
done

echo "Creating indexes..."
psql -U postgres -d postgres < sql/indexes/v3/${TABLE_NAME}_up.sql

# ANALYZE for accurate functional-index selectivity stats — see the
# rationale on prepare:_table.
echo "Running ANALYZE..."
psql -U postgres -d postgres -c "ANALYZE $TABLE_NAME;"

FINAL_ROWS=$(psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM $TABLE_NAME;" | tr -d ' ')
echo "Preparation complete! Final row count: $FINAL_ROWS"
"""

