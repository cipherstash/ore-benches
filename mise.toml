[tasks."bench:query:_run_v3"]
description = "Internal: Run one v3 query benchmark (prepare + criterion + result file)"
run = """
#!/usr/bin/env bash
set -e

PREPARE_TASK="$1"    # e.g. prepare:v3:string_encrypted
BENCH_NAME="$2"      # e.g. exact_v3 (criterion bench target)
GROUP_NAME="$3"      # e.g. EXACT_V3 (criterion group dir)
