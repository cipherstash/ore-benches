[tasks."bench:ingest:convert-overhead"]
description = "Run the conversion-overhead scenario: identical encrypt workload with and without the from_v2 v2→v3 conversion, no database writes. The delta between the two families is pure conversion cost."
depends = ["bench:build"]
run = """
#!/usr/bin/env bash
set -e
[ -f .env ] && set -a && source .env && set +a

NUM_RECORDS="${1:-500,1000,10000}"

for MODE in encrypt_only encrypt_convert; do
  BENCH_NAME="convert_overhead_${MODE}"
  echo "Running $BENCH_NAME benchmark..."
  mise x -- hyperfine --export-json "target/${BENCH_NAME}_hyperfine.json" \
    -L num_records "${NUM_RECORDS}" --runs 2 \
    "NUM_RECORDS={num_records} CONVERT_MODE=${MODE} ./target/release/convert_overhead"

  echo "Combining results..."
  ./target/release/combine_benchmark "$BENCH_NAME"
  echo "Results written to results/ingest/${BENCH_NAME}_combined.json"
done
"""
