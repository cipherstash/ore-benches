  echo "Usage: mise run bench:query:_run_v3 <prepare_task> <bench_name> <group_name> <target_rows>"
  exit 1
fi

if ! [[ "$TARGET_ROWS" =~ ^[0-9]+$ ]]; then
  echo "Error: target row count must be a positive integer"
  exit 1
fi

echo "Preparing table via $PREPARE_TASK with $TARGET_ROWS rows..."
mise run "$PREPARE_TASK" "$TARGET_ROWS"

echo "Cleaning old benchmark data..."
rm -rf "target/criterion/data/main/$GROUP_NAME" "target/criterion/reports/$GROUP_NAME"

echo "Running $BENCH_NAME query benchmark..."
mkdir -p results/query
OUTPUT_FILE="results/query/${BENCH_NAME}_rows_${TARGET_ROWS}.json"
TARGET_ROWS="$TARGET_ROWS" cargo criterion --bench "$BENCH_NAME" --message-format json > "$OUTPUT_FILE"

echo "Benchmark complete! Results written to $OUTPUT_FILE"
"""

