[tasks."bench:query:all"]
description = "Run all query benchmarks across row-count tiers (10k, 100k, 1M, 10M). Optional arg caps the largest tier, e.g. `mise run bench:query:all 1000000` stops at 1M."
run = """
#!/usr/bin/env bash
set -e

# Optional arg: cap the largest row-count tier. Without it every tier up
# to and including 10M runs; `mise run bench:query:all 1000000` stops at
# 1M (skips the slow 10M tier).
MAX_ROWS="${1:-}"

if [ -n "$MAX_ROWS" ] && ! [[ "$MAX_ROWS" =~ ^[0-9]+$ ]]; then
  echo "Error: max row count must be a positive integer"
  echo "Usage: mise run bench:query:all [max_rows]"
  exit 1
fi

ALL_ROW_COUNTS=(10000 100000 1000000 10000000)
ROW_COUNTS=()
for ROWS in "${ALL_ROW_COUNTS[@]}"; do
  if [ -z "$MAX_ROWS" ] || [ "$ROWS" -le "$MAX_ROWS" ]; then
    ROW_COUNTS+=("$ROWS")
  fi
done

# Empty-array check via ${ROW_COUNTS[*]} (empty when no tier is selected).
# The bash array-length form is avoided on purpose: mise renders run
# scripts through Tera, and the brace/hash pair it contains opens a Tera
# comment and breaks the render before bash ever sees the script.
if [ -z "${ROW_COUNTS[*]}" ]; then
  echo "Error: max_rows=$MAX_ROWS excludes every tier (smallest is 10000)"
  exit 1
fi

echo "========================================"
echo "Starting comprehensive benchmark suite"
echo "Row counts: ${ROW_COUNTS[*]}"
echo "Benchmarks: exact, match, ore, group_by, combo, json"
echo "========================================"
echo ""

START_TIME=$(date +%s)

for ROWS in "${ROW_COUNTS[@]}"; do
  echo "========================================"
  echo "Running benchmarks with $ROWS rows"
  echo "========================================"
  echo ""

  echo "[1/6] Running EXACT benchmark with $ROWS rows..."
  mise run bench:query:exact "$ROWS"
  echo ""

  echo "[2/6] Running MATCH benchmark with $ROWS rows..."
  mise run bench:query:match "$ROWS"
  echo ""

  echo "[3/6] Running ORE benchmark with $ROWS rows..."
  mise run bench:query:ore "$ROWS"
  echo ""

  echo "[4/6] Running GROUP BY benchmark with $ROWS rows..."
  mise run bench:query:group_by "$ROWS"
  echo ""

  echo "[5/6] Running COMBO benchmark with $ROWS rows..."
  mise run bench:query:combo "$ROWS"
  echo ""

  echo "[6/6] Running JSON benchmark with $ROWS rows..."
  mise run bench:query:json "$ROWS"
  echo ""

  echo "Completed benchmarks for $ROWS rows"
  echo ""
done

END_TIME=$(date +%s)
ELAPSED=$((END_TIME - START_TIME))
HOURS=$((ELAPSED / 3600))
MINUTES=$(((ELAPSED % 3600) / 60))
SECONDS=$((ELAPSED % 60))

echo "========================================"
echo "All benchmarks complete!"
echo "Total time: ${HOURS}h ${MINUTES}m ${SECONDS}s"
echo "Results saved in results/query/"
echo "========================================"
"""

