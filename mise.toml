[tasks."prepare:category_plaintext"]
description = "Prepare category_plaintext_<size> table with ~250 low-cardinality categorical strings (CAT_001..CAT_250, uniform random)"
depends = ["postgres"]
run = """
#!/usr/bin/env bash
set -e

TARGET_ROWS="$1"

if [ -z "$TARGET_ROWS" ]; then
  echo "Error: target row count argument required"
  echo "Usage: mise run prepare:category_plaintext <target_rows>"
  exit 1
fi

case "$TARGET_ROWS" in
  10000|100000|1000000|10000000)
    ;;
  *)
    echo "Error: TARGET_ROWS must be one of: 10000, 100000, 1000000, 10000000"
    exit 1
    ;;
esac

TABLE_NAME="category_plaintext_${TARGET_ROWS}"

echo "Waiting for PostgreSQL to be ready..."
until pg_isready -U postgres > /dev/null 2>&1; do
  sleep 1
done

CURRENT_ROWS=$(psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM $TABLE_NAME;" | tr -d ' ')

echo "Current rows in $TABLE_NAME: $CURRENT_ROWS"
echo "Target rows: $TARGET_ROWS"

if [ "$CURRENT_ROWS" -ge "$TARGET_ROWS" ]; then
  echo "Table already has $CURRENT_ROWS rows (>= $TARGET_ROWS). No action needed."
  exit 0
fi

ROWS_TO_INSERT=$((TARGET_ROWS - CURRENT_ROWS))
echo "Inserting $ROWS_TO_INSERT random category values (CAT_001..CAT_250, uniform)..."

# `format('CAT_%s', lpad(((random()*249)::int + 1)::text, 3, '0'))` matches the
# Rust FakeCategory output `format!("CAT_{:03}", n)`. 250 distinct buckets.
psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "
  INSERT INTO $TABLE_NAME (value)
  SELECT 'CAT_' || lpad(((random() * 249)::int + 1)::text, 3, '0')
  FROM generate_series(1, $ROWS_TO_INSERT) g;
"

FINAL_ROWS=$(psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM $TABLE_NAME;" | tr -d ' ')
echo "Preparation complete! Final row count: $FINAL_ROWS"
"""

[tasks."prepare:string_plaintext"]
description = "Prepare string_plaintext_<size> table with random high-cardinality strings (md5)"
depends = ["postgres"]
run = """
#!/usr/bin/env bash
set -e

TARGET_ROWS="$1"

if [ -z "$TARGET_ROWS" ]; then
  echo "Error: target row count argument required"
  echo "Usage: mise run prepare:string_plaintext <target_rows>"
  exit 1
fi

case "$TARGET_ROWS" in
  10000|100000|1000000|10000000)
    ;;
  *)
    echo "Error: TARGET_ROWS must be one of: 10000, 100000, 1000000, 10000000"
    exit 1
    ;;
esac

TABLE_NAME="string_plaintext_${TARGET_ROWS}"

echo "Waiting for PostgreSQL to be ready..."
until pg_isready -U postgres > /dev/null 2>&1; do
  sleep 1
done

CURRENT_ROWS=$(psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM $TABLE_NAME;" | tr -d ' ')

echo "Current rows in $TABLE_NAME: $CURRENT_ROWS"
echo "Target rows: $TARGET_ROWS"

if [ "$CURRENT_ROWS" -ge "$TARGET_ROWS" ]; then
  echo "Table already has $CURRENT_ROWS rows (>= $TARGET_ROWS). No action needed."
  exit 0
fi

ROWS_TO_INSERT=$((TARGET_ROWS - CURRENT_ROWS))
echo "Inserting $ROWS_TO_INSERT random rows (md5 of (random, ordinal))..."

# md5(random()::text || g::text) is high-cardinality 32-char hex per row.
# Single SQL insert in PG is far faster than per-row roundtrips — completes
# 10M rows in tens of seconds, no encryption-client dependency.
psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "
  INSERT INTO $TABLE_NAME (value)
  SELECT md5(random()::text || g::text)
  FROM generate_series(1, $ROWS_TO_INSERT) g;
"

FINAL_ROWS=$(psql -U postgres -d postgres -t -c "SELECT COUNT(*) FROM $TABLE_NAME;" | tr -d ' ')
echo "Preparation complete! Final row count: $FINAL_ROWS"
"""

[tasks."bench:query:ore"]
description = "Run ORE query benchmark"
run = """
#!/usr/bin/env bash
set -e

TARGET_ROWS="$1"

if [ -z "$TARGET_ROWS" ]; then
  echo "Error: target row count argument required"
  echo "Usage: mise run bench:query:ore <target_rows>"
  exit 1
fi

if ! [[ "$TARGET_ROWS" =~ ^[0-9]+$ ]]; then
  echo "Error: target row count must be a positive integer"
  exit 1
fi

echo "Preparing integer_encrypted table with $TARGET_ROWS rows..."
mise run prepare:integer_encrypted "$TARGET_ROWS"

echo "Cleaning old benchmark data..."
rm -rf target/criterion/data/main/ORE target/criterion/reports/ORE

echo "Running ORE query benchmark..."
mkdir -p results/query
OUTPUT_FILE="results/query/ore_rows_${TARGET_ROWS}.json"
TARGET_ROWS="$TARGET_ROWS" cargo criterion --bench ore --message-format json > "$OUTPUT_FILE"

echo "Benchmark complete! Results written to $OUTPUT_FILE"
"""

