[package]
name = "dbbenches"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sqlx = { version = "0.8", features = [ "runtime-tokio-native-tls" , "postgres", "json" ] }
tokio = { version = "1.47.1", features = ["full"] }
criterion = { version = "0.4.0", features = [ "async_tokio" ]}
criterion-table = "0.4.2"
ore-rs = "0.7.0"
hex = "0.4.3"
hex-literal = "0.3.4"
rand = "0.8.5"
# cipherstash-client + stack-profile ship from the same cipherstash-suite
# workspace and must stay version-locked — cipherstash-client implements
# `KeyProvider` for stack-profile's `ProfileStore`, so a source/version
# mismatch produces two incompatible `ProfileStore` types. Pinned to the
# crates.io pre-release carrying the ste_vec consolidation
# (cipherstash-suite#1955) plus the follow-up `oc` / `op` field collapse —
# the payload shape EQL 2.3.0 targets. Bump alongside the EQL release pin
# in mise.toml's setup-db task.
cipherstash-client = { version = "=0.34.1-alpha.9", features = ["tokio"] }
stack-profile = "=0.34.1-alpha.9"
# EQL v2.3 -> v3 payload conversion (the supported migration path; the
# converter's docs name these benches as a consumer). The pinned
# cipherstash-client above emits v2.3 payloads; eql-bindings::from_v2
# reshapes them into the eql_v3 domain payloads. Switch `branch` to
# `tag = "eql-<semver>"` once EQL v3 is released.
eql-bindings = { git = "https://github.com/cipherstash/encrypt-query-language", branch = "eql_v3" }
# Plaintext::Decimal takes rust_decimal::Decimal, which cipherstash-client
# does not re-export — used by the scalar_smoke_v3 numeric-family coverage.
rust_decimal = "1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
fake = { version = "4.4.0", features = ["chrono"] }
# tracing-subscriber wires up the cipherstash-client / zerokms-protocol
# trace! emissions to stderr when RUST_LOG is set. Without a subscriber
# the trace calls are no-ops; with one, RUST_LOG=cipherstash_client=trace
# (etc.) surfaces the rich ViturRequestError display from the inner
# trace! at vitur_client::generate_keys.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

